<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="35%" cy="22%" r="95%">
      <stop stop-color="#4f6b5a"/><stop offset=".55" stop-color="#2c4538"/><stop offset="1" stop-color="#14231d"/>
    </radialGradient>
    <radialGradient id="face" cx="40%" cy="34%" r="70%">
      <stop stop-color="#ffe866"/><stop offset=".65" stop-color="#ffcf1f"/><stop offset="1" stop-color="#e9a50b"/>
    </radialGradient>
    <linearGradient id="shadeL" x1="1" x2="0">
      <stop stop-color="#000" stop-opacity=".18"/><stop offset=".35" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadeR" x1="0" x2="1">
      <stop stop-color="#000" stop-opacity=".10"/><stop offset=".35" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="left"><rect x="-200" y="-200" width="200" height="400"/></clipPath>
    <clipPath id="right"><rect x="0" y="-200" width="200" height="400"/></clipPath>
    <!-- the whole smiley, centred on 0,0; each half shows its part of it -->
    <g id="smiley">
      <circle r="150" fill="url(#face)" stroke="#c98a08" stroke-width="7"/>
      <ellipse cx="-52" cy="-38" rx="18" ry="33" fill="#2b1a08"/><ellipse cx="52" cy="-38" rx="18" ry="33" fill="#2b1a08"/>
      <circle cx="-58" cy="-50" r="6" fill="#fff" fill-opacity=".85"/><circle cx="46" cy="-50" r="6" fill="#fff" fill-opacity=".85"/>
      <path d="M-86 30 Q0 112 86 30" fill="none" stroke="#2b1a08" stroke-width="17" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#sky)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#e8e2d0" stroke-opacity=".12" stroke-width="2"/>
  <!-- the net: hoop and a hint of netting, handle down to the corner -->
  <path d="M352 438 L430 500" stroke="#c49a63" stroke-width="20" stroke-linecap="round"/>
  <ellipse cx="300" cy="352" rx="96" ry="96" fill="#efe9da" fill-opacity=".07" stroke="#efe9da" stroke-opacity=".6" stroke-width="9"/>
  <!-- the smiley, folded down the middle: both halves raised a little, like a butterfly's wings -->
  <g transform="translate(236 236)">
    <g clip-path="url(#left)" transform="skewY(7) scale(.9 1)"><use href="#smiley"/><rect x="-150" y="-150" width="150" height="300" fill="url(#shadeL)"/></g>
    <g clip-path="url(#right)" transform="skewY(-7) scale(.9 1)"><use href="#smiley"/><rect x="0" y="-150" width="150" height="300" fill="url(#shadeR)"/></g>
    <!-- the fold -->
    <path d="M0 -150 L0 150" stroke="#9a6406" stroke-opacity=".55" stroke-width="4"/>
  </g>
</svg>
